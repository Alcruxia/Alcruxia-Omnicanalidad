name: Deploy Staging — stg.alcruxia.com

on:
  push:
    branches: [stg]

jobs:
  build:
    name: Build & Push imagen Docker (staging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alcruxia/chatwoot
          tags: |
            type=raw,value=stg
            type=sha,prefix=stg-

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=stg
          cache-to: type=gha,mode=max,scope=stg

  deploy:
    name: Deploy al servidor staging
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_SHA
          script: |
            # Login a GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Clonar o actualizar el repo
            if [ -d ~/alcruxia-omnicanalidad-stg-repo ]; then
              cd ~/alcruxia-omnicanalidad-stg-repo
              git fetch origin stg
              git reset --hard origin/stg
            else
              git clone --branch stg https://x-access-token:${GITHUB_TOKEN}@github.com/Alcruxia/Alcruxia-Omnicanalidad.git ~/alcruxia-omnicanalidad-stg-repo
              cd ~/alcruxia-omnicanalidad-stg-repo
            fi

            # Copiar archivos de configuración del servidor (no están en el repo)
            cp ~/alcruxia-omnicanalidad-stg/.env.stg ~/alcruxia-omnicanalidad-stg-repo/.env.stg
            mkdir -p ~/alcruxia-omnicanalidad-stg-repo/caddy
            cp ~/alcruxia-omnicanalidad-stg/caddy/Caddyfile ~/alcruxia-omnicanalidad-stg-repo/caddy/Caddyfile

            # Deploy
            cd ~/alcruxia-omnicanalidad-stg-repo
            docker compose -f docker-compose.stg.yaml --env-file .env.stg pull
            docker compose -f docker-compose.stg.yaml --env-file .env.stg up -d --remove-orphans
            docker compose -f docker-compose.stg.yaml exec -T rails bundle exec rails db:chatwoot_prepare || true

            # Limpieza
            docker logout ghcr.io
            docker image prune -f
            echo "Deploy staging completado: $(date)"
