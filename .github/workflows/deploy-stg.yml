name: Deploy Staging — stg.alcruxia.com

on:
  push:
    branches: [stg]

jobs:
  build:
    name: Build & Push imagen Docker (staging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alcruxia/chatwoot
          tags: |
            type=raw,value=stg
            type=sha,prefix=stg-

      - name: Build y push imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy al servidor staging
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            cd ~/alcruxia-omnicanalidad-stg
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose -f docker-compose.stg.yaml pull
            docker compose -f docker-compose.stg.yaml up -d --remove-orphans
            docker compose -f docker-compose.stg.yaml exec -T rails bundle exec rails db:chatwoot_prepare
            docker logout ghcr.io
            docker image prune -f
            echo "Deploy staging completado: $(date)"
