services:
  base: &base
    image: ghcr.io/alcruxia/alcruxia-omnicanalidad:${IMAGE_TAG:-prod}
    env_file: .env.prod
    volumes:
      - storage:/app/storage
    networks:
      - alcruxia-omnicanalidad-net
    restart: unless-stopped

  rails:
    <<: *base
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *base
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  redis:
    image: redis:alpine
    env_file: .env.prod
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --requirepass \"${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    networks:
      - alcruxia-omnicanalidad-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    env_file: .env.prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_certs:/config
    networks:
      - alcruxia-omnicanalidad-net
    restart: unless-stopped
    depends_on:
      - rails

networks:
  alcruxia-omnicanalidad-net:
    driver: bridge

volumes:
  storage:
  redis_data:
  caddy_data:
  caddy_certs:
